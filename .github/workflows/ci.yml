name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  quality:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Test with race detector and coverage
        run: make coverage
      - name: Enforce protocol coverage
        run: make coverage-protocol
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
            coverage.html
          if-no-files-found: error

  cross-build:
    name: Cross-compile static binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build target matrix
        run: make build-all VERSION=ci
      - name: Verify artifacts
        run: |
          test -f dist/gbbconnect_linux_amd64
          test -f dist/gbbconnect_linux_arm64
          test -f dist/gbbconnect_linux_arm_v7
          test -f dist/gbbconnect_windows_amd64.exe
          test -f dist/gbbconnect_darwin_arm64
      - name: Verify static Linux binaries
        run: |
          file dist/gbbconnect_linux_amd64 | grep -q "statically linked"
          file dist/gbbconnect_linux_arm64 | grep -q "statically linked"
          file dist/gbbconnect_linux_arm_v7 | grep -q "statically linked"
          if ldd dist/gbbconnect_linux_amd64 2>&1 | grep -qv "not a dynamic executable"; then
            echo "linux/amd64 artifact is dynamically linked"
            exit 1
          fi

  windows-service:
    name: Windows Service lifecycle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test Windows packages
        run: go test ./... -count=1
      - name: Build Windows executable
        shell: pwsh
        run: |
          go build `
            -trimpath `
            -ldflags "-s -w -X main.version=ci-windows" `
            -o "$env:RUNNER_TEMP\gbbconnect.exe" `
            ./cmd/gbbconnect
      - name: Exercise Service Control Manager lifecycle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Join-Path $env:RUNNER_TEMP "gbbconnect.exe"
          $dataDir = Join-Path $env:ProgramData "gbbconnect"
          $config = Join-Path $dataDir "gbbconnect.yaml"
          $installed = $false

          New-Item -ItemType Directory -Force $dataDir | Out-Null
          @'
          version: 1
          logging:
            level: info
          plants:
            - number: 1
              name: "Windows CI"
              enabled: false
              driver: random
              cloud:
                plant_id: "ci"
                plant_token: ""
                mqtt_address: "127.0.0.1"
                mqtt_port: 1883
                tls_insecure_skip_verify: false
          '@ | Set-Content -Encoding utf8 $config

          function Wait-ServiceStatus([string] $Wanted) {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              $service = Get-Service -Name "gbbconnect" -ErrorAction SilentlyContinue
              if ($null -ne $service -and $service.Status.ToString() -eq $Wanted) {
                return
              }
              Start-Sleep -Seconds 1
            }
            throw "gbbconnect did not reach service state $Wanted"
          }

          try {
            & $binary config validate --config $config
            if ($LASTEXITCODE -ne 0) {
              throw "configuration validation failed with exit code $LASTEXITCODE"
            }

            & $binary service install
            if ($LASTEXITCODE -ne 0) {
              throw "service install failed with exit code $LASTEXITCODE"
            }
            $installed = $true

            sc.exe start gbbconnect
            if ($LASTEXITCODE -ne 0) {
              throw "sc.exe start failed with exit code $LASTEXITCODE"
            }
            Wait-ServiceStatus "Running"
            sc.exe query gbbconnect

            sc.exe stop gbbconnect
            if ($LASTEXITCODE -ne 0) {
              throw "sc.exe stop failed with exit code $LASTEXITCODE"
            }
            Wait-ServiceStatus "Stopped"

            $events = Get-WinEvent -FilterHashtable @{
              LogName = "Application"
              ProviderName = "gbbconnect"
            } -MaxEvents 50
            if (-not ($events.Message -match "service starting")) {
              throw "Windows Event Log has no service start event"
            }
            if (-not ($events.Message -match "service stopped")) {
              throw "Windows Event Log has no graceful service stop event"
            }
            if (-not (Test-Path (Join-Path $dataDir "state") -PathType Container)) {
              throw "service state directory was not created"
            }
          }
          finally {
            if ($installed) {
              $service = Get-Service -Name "gbbconnect" -ErrorAction SilentlyContinue
              if ($null -ne $service -and $service.Status -ne "Stopped") {
                sc.exe stop gbbconnect
                Wait-ServiceStatus "Stopped"
              }
              & $binary service uninstall
              if ($LASTEXITCODE -ne 0) {
                throw "service uninstall failed with exit code $LASTEXITCODE"
              }
            }
          }
