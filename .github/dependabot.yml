version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    assignees:
      - "KrzysztofHajdamowicz"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    assignees:
      - "KrzysztofHajdamowicz"

  - package-ecosystem: "docker"
    directories:
      - "/deploy"
      - "/gbbconnect_go"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    assignees:
      - "KrzysztofHajdamowicz"
